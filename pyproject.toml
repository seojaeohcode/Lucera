[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucera"
version = "1.0.0"
description = "Yeongam-only complaint evidence and conversational precheck demo"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
